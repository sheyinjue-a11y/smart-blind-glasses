<svg viewBox="0 0 1000 880" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #121212; }
    .board { fill: #222222; stroke: #444; stroke-width: 2; rx: 8; }
    .pin { fill: #E6A23C; }
    .pad { fill: #E6A23C; rx: 3; }
    .text { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; fill: #E0E0E0; font-size: 14px; }
    .text-sm { font-family: 'Segoe UI', sans-serif; fill: #A0A0A0; font-size: 11px; }
    .title { font-family: 'Segoe UI', sans-serif; font-size: 26px; font-weight: bold; fill: #00FFCC; }
    .line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; transition: all 0.2s; }
    .line:hover { stroke-width: 6; filter: drop-shadow(0 0 8px currentColor); cursor: pointer; }
    
    /* 线条颜色定义 */
    .pwr-red { stroke: #FF4757; }
    .pwr-gnd { stroke: #747D8C; }
    .i2c-sda { stroke: #1E90FF; }
    .i2c-scl { stroke: #ECCC68; }
    .i2s-lrc { stroke: #FFA502; }
    .i2s-bck { stroke: #9B59B6; }
    .i2s-din { stroke: #FF6B81; }
    .usb-dp { stroke: #2ED573; }
    .usb-dn { stroke: #FFFFFF; }
  </style>

  <rect width="1000" height="880" class="bg" />
  <text x="500" y="40" class="title" text-anchor="middle">ESP32S3 Sense AI 智能眼镜全局接线图</text>
  
  <rect x="30" y="720" width="180" height="130" class="board" fill="#1A1A1A"/>
  <text x="40" y="745" class="text" font-weight="bold" fill="#FFF">图例 / Legend:</text>
  <line x1="40" y1="765" x2="70" y2="765" class="line pwr-red"/><text x="80" y="770" class="text-sm">电源 (+/VCC/VBUS)</text>
  <line x1="40" y1="785" x2="70" y2="785" class="line pwr-gnd"/><text x="80" y="790" class="text-sm">地线 (GND/-)</text>
  <line x1="40" y1="805" x2="70" y2="805" class="line usb-dp"/><text x="80" y="810" class="text-sm">USB 数据线 (D+/D-)</text>
  <line x1="40" y1="825" x2="70" y2="825" class="line i2c-sda"/><text x="80" y="830" class="text-sm">I2C / I2S 信号线</text>

  <g id="wiring">
    <path class="line pwr-red" d="M 170 70 L 210 70 L 210 80 L 250 80" /> <path class="line pwr-red" d="M 330 80 L 920 80 L 920 840 L 520 840 L 520 600" /> <path class="line pwr-gnd" d="M 170 110 L 230 110 L 230 830 L 560 830 L 560 600" /> <path class="line pwr-red" d="M 750 65 L 670 65 L 670 280 L 650 280" /> <path class="line pwr-gnd" d="M 750 85 L 690 85 L 690 310 L 650 310" /> <path class="line usb-dp" d="M 750 105 L 850 105 L 850 740 L 450 740 L 450 600" /> <path class="line usb-dn" d="M 750 125 L 830 125 L 830 720 L 480 720 L 480 600" /> <path class="line pwr-red" d="M 170 620 L 300 620 L 300 800 L 670 800 L 670 340 L 650 340" /> <path class="line pwr-gnd" d="M 170 640 L 280 640 L 280 810 L 680 810 L 680 310 L 650 310" /> <path class="line i2c-sda" d="M 170 660 L 260 660 L 260 400 L 350 400" /> <path class="line i2c-scl" d="M 170 680 L 250 680 L 250 430 L 350 430" /> <path class="line pwr-red" d="M 750 620 L 710 620 L 710 280 L 650 280" /> <path class="line pwr-gnd" d="M 750 640 L 700 640 L 700 310 L 650 310" /> <path class="line i2s-lrc" d="M 750 660 L 730 660 L 730 230 L 330 230 L 330 280 L 350 280" /> <path class="line i2s-bck" d="M 750 680 L 750 210 L 310 210 L 310 310 L 350 310" /> <path class="line i2s-din" d="M 750 700 L 770 700 L 770 190 L 290 190 L 290 340 L 350 340" /> <path class="line pwr-red" d="M 900 640 L 870 640" /> <path class="line pwr-gnd" d="M 900 680 L 870 680" /> </g>

  <g transform="translate(350, 250)">
    <rect width="300" height="350" class="board" />
    <text x="150" y="30" class="text" font-weight="bold" font-size="18" text-anchor="middle" fill="#FFF">XIAO ESP32S3 Sense</text>
    <rect x="75" y="60" width="150" height="100" rx="4" fill="#1A1A1A" stroke="#555"/>
    <text x="150" y="110" class="text-sm" text-anchor="middle">摄像头 / 麦克风 区域</text>
    <text x="150" y="130" class="text-sm" text-anchor="middle" fill="#00FFCC">(无需额外连线)</text>

    <circle cx="0" cy="30" r="6" class="pin"/><text x="15" y="35" class="text">D0 (GPIO1)</text>
    <circle cx="0" cy="60" r="6" class="pin"/><text x="15" y="65" class="text">D1 (GPIO2)</text>
    <circle cx="0" cy="90" r="6" class="pin"/><text x="15" y="95" class="text">D2 (GPIO3)</text>
    <circle cx="0" cy="120" r="6" class="pin"/><text x="15" y="125" class="text">D3 (GPIO4)</text>
    <circle cx="0" cy="150" r="6" class="pin"/><text x="15" y="155" class="text">D4 / SDA (GPIO5)</text>
    <circle cx="0" cy="180" r="6" class="pin"/><text x="15" y="185" class="text">D5 / SCL (GPIO6)</text>
    <circle cx="0" cy="210" r="6" class="pin"/><text x="15" y="215" class="text">TX (GPIO43)</text>
    <circle cx="0" cy="240" r="6" class="pin"/><text x="15" y="245" class="text">RX (GPIO44)</text>

    <circle cx="300" cy="30" r="6" class="pin"/><text x="285" y="35" class="text" text-anchor="end">5V (VBUS)</text>
    <circle cx="300" cy="60" r="6" class="pin"/><text x="285" y="65" class="text" text-anchor="end">GND</text>
    <circle cx="300" cy="90" r="6" class="pin"/><text x="285" y="95" class="text" text-anchor="end">3V3</text>
    <circle cx="300" cy="120" r="6" class="pin"/><text x="285" y="125" class="text" text-anchor="end">D10 (GPIO9)</text>
    <circle cx="300" cy="150" r="6" class="pin"/><text x="285" y="155" class="text" text-anchor="end">D9 (GPIO8)</text>
    <circle cx="300" cy="180" r="6" class="pin"/><text x="285" y="185" class="text" text-anchor="end">D8 (GPIO7)</text>

    <rect x="90" y="345" width="20" height="10" class="pad"/><text x="100" y="335" class="text-sm" text-anchor="middle">D+</text>
    <rect x="120" y="345" width="20" height="10" class="pad"/><text x="130" y="335" class="text-sm" text-anchor="middle">D-</text>
    <rect x="160" y="345" width="20" height="10" class="pad"/><text x="170" y="335" class="text-sm" text-anchor="middle">BAT+</text>
    <rect x="200" y="345" width="20" height="10" class="pad"/><text x="210" y="335" class="text-sm" text-anchor="middle">BAT-</text>
  </g>

  <g transform="translate(50, 40)">
    <rect width="120" height="90" class="board" fill="#2C3A47"/>
    <text x="60" y="30" class="text" font-weight="bold" text-anchor="middle">500mAh 电池</text>
    <circle cx="120" cy="30" r="5" class="pin"/><text x="105" y="35" class="text" text-anchor="end">正极 (+)</text>
    <circle cx="120" cy="70" r="5" class="pin"/><text x="105" y="75" class="text" text-anchor="end">负极 (-)</text>
  </g>

  <g transform="translate(250, 60)">
    <rect width="80" height="40" class="board" fill="#3D3D3D"/>
    <text x="40" y="-10" class="text" font-weight="bold" text-anchor="middle">总控开关</text>
    <circle cx="0" cy="20" r="5" class="pin"/><text x="10" y="25" class="text-sm">进</text>
    <circle cx="80" cy="20" r="5" class="pin"/><text x="70" y="25" class="text-sm" text-anchor="end">出</text>
  </g>

  <g transform="translate(750, 30)">
    <rect width="100" height="120" class="board" fill="#1B1464"/>
    <text x="50" y="25" class="text" font-weight="bold" text-anchor="middle">Type-C 母座</text>
    <circle cx="0" cy="35" r="5" class="pin"/><text x="15" y="40" class="text">VBUS</text>
    <circle cx="0" cy="55" r="5" class="pin"/><text x="15" y="60" class="text">GND</text>
    <circle cx="0" cy="75" r="5" class="pin"/><text x="15" y="80" class="text">D+</text>
    <circle cx="0" cy="95" r="5" class="pin"/><text x="15" y="100" class="text">D-</text>
  </g>

  <g transform="translate(50, 580)">
    <rect width="120" height="130" class="board" fill="#6F1E51"/>
    <text x="60" y="25" class="text" font-weight="bold" text-anchor="middle">IMU 姿态传感器</text>
    <text x="60" y="45" class="text-sm" text-anchor="middle">(ICM42688)</text>
    <circle cx="120" cy="40" r="5" class="pin"/><text x="105" y="45" class="text" text-anchor="end">VCC</text>
    <circle cx="120" cy="60" r="5" class="pin"/><text x="105" y="65" class="text" text-anchor="end">GND</text>
    <circle cx="120" cy="80" r="5" class="pin"/><text x="105" y="85" class="text" text-anchor="end">SDA</text>
    <circle cx="120" cy="100" r="5" class="pin"/><text x="105" y="105" class="text" text-anchor="end">SCL</text>
  </g>

  <g transform="translate(750, 580)">
    <rect width="120" height="150" class="board" fill="#833471"/>
    <text x="60" y="25" class="text" font-weight="bold" text-anchor="middle">音频功放板</text>
    <text x="60" y="45" class="text-sm" text-anchor="middle">(MAX98357)</text>
    
    <circle cx="0" cy="40" r="5" class="pin"/><text x="15" y="45" class="text">VIN / VDD</text>
    <circle cx="0" cy="60" r="5" class="pin"/><text x="15" y="65" class="text">GND</text>
    <circle cx="0" cy="80" r="5" class="pin"/><text x="15" y="85" class="text">LRC</text>
    <circle cx="0" cy="100" r="5" class="pin"/><text x="15" y="105" class="text">BCLK</text>
    <circle cx="0" cy="120" r="5" class="pin"/><text x="15" y="125" class="text">DIN</text>
    
    <circle cx="120" cy="60" r="5" class="pin"/><text x="105" y="65" class="text" text-anchor="end">OUT +</text>
    <circle cx="120" cy="100" r="5" class="pin"/><text x="105" y="105" class="text" text-anchor="end">OUT -</text>
  </g>

  <g transform="translate(900, 610)">
    <rect width="70" height="90" class="board" fill="#000000" stroke="#666"/>
    <text x="35" y="25" class="text" font-weight="bold" text-anchor="middle">1811</text>
    <text x="35" y="45" class="text" text-anchor="middle">喇叭</text>
    <circle cx="0" cy="30" r="5" class="pin"/><text x="15" y="35" class="text">红 (+)</text>
    <circle cx="0" cy="70" r="5" class="pin"/><text x="15" y="75" class="text">黑 (-)</text>
  </g>

</svg>